[package]
name = "choegui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Motion and polished interaction primitives for egui"

[dependencies]
egui = "0.29.1"

[dev-dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[profile.dev]
debug = 0
incremental = false

[[example]]
name = "showcase"
path = "examples/showcase.rs"
