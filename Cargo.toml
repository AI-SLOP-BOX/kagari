[package]
name = "kagari-vfx"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Layer-based motion graphics and compositing engine (After Effects-style workflows in Rust)"
repository = "https://github.com/AI-SLOP-BOX/kagari"
keywords = ["vfx", "compositing", "motion-graphics", "video", "rendering"]
categories = ["multimedia", "graphics"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",  # REQUIRED: embeds egui default fonts — without this NO text renders!
    "wgpu",
    "wayland",
    "x11",
], optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.3", optional = true }
log = "0.4.21"
# libloading: dlopen-based OpenFX plugin probing (host-side ABI discovery)
libloading = "0.8"
env_logger = "0.11.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.15.0", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
wgpu = { version = "22", optional = true }
# Rhai: lightweight Rust-native scripting engine for AE-style expressions
rhai = { version = "1.18", features = ["sync"] }
# rand: for film grain and procedural noise
rand = "0.8"
# egui_extras for SVG icon rendering support
egui_extras = { version = "0.29", features = ["svg"], optional = true }
# egui-phosphor: professional icon font for crisp UI glyphs
egui-phosphor = { version = "0.7", optional = true }
choegui = { path = "vendor/choegui", optional = true }
sys-locale = { version = "0.3.2", optional = true }
# rfd for native OS file dialogs (macOS / Windows / Linux)
rfd = { version = "0.14", optional = true }
# rayon for multi-core parallel pixel sweeps
rayon = "1.8"
# rodio: audio playback for synced AV preview (gui only)
rodio = { version = "0.19", optional = true }
# Symphonia: in-process decoding for imported audio assets and waveform analysis
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# clap: CLI argument parsing
clap = { version = "4", features = ["derive"], optional = true }
# png: headless frame export
png = { version = "0.17", optional = true }
# flate2: zlib streams for OpenEXR ZIP compression (headless VFX interchange export)
flate2 = { version = "1", optional = true }
# ab_glyph: font loading and glyph rasterization for text layers
ab_glyph = "0.2"
# image: loading JPEG/PNG image layers; `exr`/`tiff` keep VFX interchange
# formats open for import (writer side lives in core::exr_writer)
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "exr",
    "tiff",
] }
# libc: disk usage stats (statvfs) for the Home storage panel
libc = "=0.2.189"
# naga: runtime WGSL syntax and type validation for custom shader plugins
naga = { version = "0.19", features = ["wgsl-in"] }

[dev-dependencies]
pollster = "0.3"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:rodio", "dep:egui-phosphor", "dep:choegui", "dep:sys-locale", "wgpu"]
preview = ["dep:winit", "dep:pollster", "wgpu"]
cli = ["dep:clap", "dep:png", "dep:flate2"]
cli-gpu = ["cli", "dep:pollster", "wgpu"]
wgpu = ["dep:wgpu"]

[[bin]]
name = "kagari"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "kagari-studio"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "kagari-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

[[bin]]
name = "gen-splash"
path = "src/bin/gen_splash/main.rs"
required-features = ["cli"]

[[bin]]
name = "gen-glitch"
path = "src/bin/gen_glitch/main.rs"
required-features = ["cli"]

[[bin]]
name = "gen-logo"
path = "src/bin/gen_logo/main.rs"
required-features = ["cli"]

# Bridge acceptance gate: verified with mock/fallback pathways when external plugins are not set
[[test]]
name = "bridge_acceptance"
path = "tests/bridge_acceptance.rs"
test = true

[profile.dev]
opt-level = 1

# ─── KAGARI CORE CAPABILITIES & AE PARITY MATRIX ─────────────────────────────
# Verified in-tree implementations in src/core/
[package.metadata.kagari.engine_capabilities]
spatial_3d = [
    "Camera3D (Perspective Projection, FOV, Multi-camera switching)",
    "DepthOfField (Aperture, Focus Distance, Polygonal Iris Bokeh)",
    "Light3D (Point, Spot, Ambient, Parallel with Distance Falloff)",
    "ShadowMapping (Light shadow darkness, casting & receiving)",
    "Z-Sorting & 3D Layer Compositing",
    "Auto-Orient along 3D motion path",
    "C4D 3D Mesh Extrusion (Bevel, Depth, Normals generation)",
]
vector_shapes = [
    "SDF Shape Rasterizer (Rectangle, Ellipse, Star, Polygon, Freeform Bezier)",
    "ShapeRepeater (Instancing, Transform deltas, Opacity decay)",
    "TrimPaths (Start, End, Offset trim)",
    "WigglePaths (Procedural shape noise)",
    "ZigzagPaths (Wave / Corner ridges)",
    "MergePaths & OffsetPaths (Boolean operations & stroke offset)",
    "AutoTrace (Bitmap edge detection to Bezier Spline paths)",
]
typography = [
    "TextAnimator (Per-character RangeSelector, Wiggly, Ramp, Shape selectors)",
    "TextToShapes (Vector glyph outline extraction)",
    "FontRasterizer (ab_glyph with Faux Bold, Italic, Tracking, Leading)",
    "PathText (Text aligned and animated along curved vector paths)",
]
deformation = [
    "PuppetPinEngine (Moving Least Squares 2D deformation & Delaunay Triangulation)",
    "BendWarp & Spherize",
    "CylinderSphereWarp",
    "PageTurn 3D (Cylindrical paper peel & back-side shading)",
    "TurbulentDisplace (Perlin vector noise warping)",
    "CornerPin (4-point projective homography warp)",
]
tracking = [
    "CameraTracker3D (Optical parallax depth & camera trajectory solve from 2D tracks)",
    "BlenderCameraTrack (Interchange & keyframe baking)",
    "PointTracker (Multi-point luminance/cross-correlation tracking, Stabilize)",
    "PlanarTracker (Homography region tracking)",
    "MotionSketch (Real-time cursor recording to keyframes)",
    "TheSmoother (Gaussian/moving average keyframe reduction)",
    "TheWiggler (Procedural keyframe noise injector)",
]
video_ai = [
    "ContentAwareFill (Spatio-temporal Fast Marching inpainting for object removal)",
    "RotoBrush (Foreground/Background color modeling, boundary propagation & edge feathering)",
    "OpticalFlowTimewarp (Bidirectional dense optical flow intermediate frame synthesis)",
]
simulation = [
    "AdvancedParticles3D (3D emitters, Gravity, Wind, Vortex, Floor bounce, Sprites)",
    "PhysicsEngine (Rigid 2D velocity & restitution)",
]
compositing = [
    "UniversalTrackMatte (Target any arbitrary layer, Alpha / Luma / Inverted)",
    "BlendModes (30+ AE blend modes)",
    "LinearLightComposite (1.0 Gamma compositing toggle)",
    "CollapseTransformations (Nested pre-comp 3D space continuity)",
    "SetMatte (Channel copy & composite)",
]
audio = [
    "14-Format Decoder via Symphonia (AAC, MP3, FLAC, WAV, OGG, ALAC, etc.)",
    "AudioBuffer & Multi-track Mixer",
    "AudioToKeyframes (Converts waveform amplitude into Slider Controls)",
    "AudioSpectrum (FFT-based frequency bar visualizer)",
    "DSP (Parametric EQ, Flanger, Chorus)",
]
color = [
    "OpenColorIO (OCIO) & ACEScg Color Transformations",
    "ICC Color Profile conversion",
    "1D & 3D LUT Cube Cache",
    "HDR Output Dithering (Triangular-PDF to eliminate banding)",
    "LinearColorKey & ChromaKey (Clean green/blue screen extraction)",
]
effects = [
    "GlowPro (Threshold bloom)",
    "CameraLensBlur (Iris blades, Bokeh roundness & highlights)",
    "Colorama (Phase color cycling)",
    "MotionTile & CC RepeTile (Tiling, Mirror edges)",
    "DisplacementMap (Source channel displacement)",
    "OpticalFlares (Multi-element lens flare)",
    "LightningArc (Procedural electric bolts)",
    "HeatDistortion (Thermal turbulence)",
    "EchoTime (Frame accumulation trails)",
]
automation = [
    "RhaiExpressionEngine (thisComp, thisLayer, wiggle, valueAtTime, loopOut)",
    "MOGRT Engine (Essential Properties definition, export & parameter overrides)",
    "Headless CLI Batch Rendering (Dynamic layer overrides with --override)",
]
interchange = [
    "OpenFX Discovery & ABI Properties (libloading symbol probing)",
    "OpenTimelineIO (OTIO video/audio tracks import & export)",
    "MLT Framework XML export",
    "Lottie JSON Exporter (Shapes, transforms, keyframes)",
    "OpenEXR (Half-float RGB/RGBA with Zip compression)",
]
