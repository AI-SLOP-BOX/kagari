[package]
name = "kagari-vfx"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",  # REQUIRED: embeds egui default fonts — without this NO text renders!
    "wgpu",
    "wayland",
    "x11",
], optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.3", optional = true }
log = "0.4.21"
# libloading: dlopen-based OpenFX plugin probing (host-side ABI discovery)
libloading = "0.8"
env_logger = "0.11.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.15.0", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
wgpu = { version = "22", optional = true }
# Rhai: lightweight Rust-native scripting engine for AE-style expressions
rhai = { version = "1.18", features = ["sync"] }
# rand: for film grain and procedural noise
rand = "0.8"
# egui_extras for SVG icon rendering support
egui_extras = { version = "0.29", features = ["svg"], optional = true }
# egui-phosphor: professional icon font for crisp UI glyphs
egui-phosphor = { version = "0.7", optional = true }
choegui = { path = "../choegui", optional = true }
sys-locale = { version = "0.3.2", optional = true }
# rfd for native OS file dialogs (macOS / Windows / Linux)
rfd = { version = "0.14", optional = true }
# rayon for multi-core parallel pixel sweeps
rayon = "1.8"
# rodio: audio playback for synced AV preview (gui only)
rodio = { version = "0.19", optional = true }
# Symphonia: in-process decoding for imported audio assets and waveform analysis
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# clap: CLI argument parsing
clap = { version = "4", features = ["derive"], optional = true }
# png: headless frame export
png = { version = "0.17", optional = true }
# ab_glyph: font loading and glyph rasterization for text layers
ab_glyph = "0.2"
# image: loading JPEG/PNG image layers
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# libc: disk usage stats (statvfs) for the Home storage panel
libc = "=0.2.189"
# naga: runtime WGSL syntax and type validation for custom shader plugins
naga = { version = "0.19", features = ["wgsl-in"] }

[dev-dependencies]
pollster = "0.3"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:rodio", "dep:egui-phosphor", "dep:choegui", "dep:sys-locale", "wgpu"]
preview = ["dep:winit", "dep:pollster", "wgpu"]
cli = ["dep:clap", "dep:png"]
cli-gpu = ["cli", "dep:pollster", "wgpu"]
wgpu = ["dep:wgpu"]

[[bin]]
name = "kagari"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "kagari-studio"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "kagari-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

[[bin]]
name = "gen-splash"
path = "src/bin/gen_splash/main.rs"
required-features = ["cli"]
