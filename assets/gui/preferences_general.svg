<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 828" width="1084" height="828">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <clipPath id="active-card-clip">
      <rect x="12" y="66" width="204" height="42" rx="6" ry="6" />
    </clipPath>
    <clipPath id="window-corners">
      <rect x="0" y="0" width="1024" height="768" rx="10" ry="10" />
    </clipPath>
  </defs>

  <!--  Home screen backdrop  -->
  <rect width="1084" height="828" fill="#18191d" />
  
  <!--  Modal shadow  -->
  <rect x="30" y="30" width="1024" height="768" rx="10" ry="10" fill="#000000" filter="url(#shadow)" />
  
  <!--  Modal Window (1024 x 768)  -->
  <g transform="translate(30, 30)">
    <g clip-path="url(#window-corners)">
      <!--  1. Base background (settings content area)  -->
      <rect x="0" y="0" width="1024" height="768" fill="#1e1f24"/>

      <!--  2. Sidebar background (left 228px)  -->
      <rect x="0" y="0" width="228" height="768" fill="#22252b"/>

      <!--  3. Vertical dividing seam line between sidebar and right settings area  -->
      <line x1="228" y1="43" x2="228" y2="712" stroke="#31353e" stroke-width="1"/>

      <!--  4. Top Header Band (y=0..43, height=43)  -->
      <rect x="0" y="0" width="1024" height="43" fill="#25282e"/>
      <line x1="0" y1="43" x2="1024" y2="43" stroke="#2b2e35" stroke-width="1"/>
      <!--  Header Title: 環境設定 (太字)  -->
      <text x="14" y="21.5" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="14" font-weight="700" dominant-baseline="central">環境設定</text>
      <!--  Header Close Button (×)  -->
      <g transform="translate(1003.5, 21.5)" stroke="#cfd2d8" stroke-width="1.4" stroke-linecap="round">
        <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/>
        <line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/>
      </g>

      <!--  5. Bottom Footer Band (y=712..768, height=56, blended color #23262c)  -->
      <rect x="0" y="712" width="1024" height="56" fill="#25282e"/>
      <line x1="0" y1="712" x2="1024" y2="712" stroke="#2b2e35" stroke-width="1"/>

      <!--  Footer Buttons  -->
      <!--  (1) デフォルトに戻す  -->
      <rect x="12" y="724" width="123" height="32" rx="6" fill="#393b42"/>
      <text x="73.5" y="740" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">デフォルトに戻す</text>

      <!--  (2) キャンセル  -->
      <rect x="833" y="724" width="88" height="32" rx="6" fill="#393b42"/>
      <text x="877.0" y="740" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">キャンセル</text>

      <!--  (3) OK  -->
      <rect x="931" y="724" width="77" height="32" rx="6" fill="#f69223"/>
      <text x="969.5" y="740" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central">OK</text>

      <!--  6. Active item card with rounded left & right (rx=6, height=42, y=66..108)  -->
      <g clip-path="url(#active-card-clip)">
        <rect x="12" y="66" width="204" height="42" fill="#4f3728"/>
        <rect x="12" y="66" width="4.5" height="42" rx="2" fill="#f39c29"/>
      </g>

      <!--  7. Sidebar Icons (Enlarged 1.3x)  -->
      <!--  1. 歯車 (Gear = 一般, Yellow/Amber #f39c29)  -->
      <g transform="translate(34.5, 87.0) scale(1.12)" stroke="#f39c29" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="0.00,-6.20 2.20,-8.21 4.25,-7.36 4.38,-4.38 5.37,-3.10 8.21,-2.20 8.50,0.00 5.99,1.60 5.37,3.10 6.01,6.01 4.25,7.36 1.60,5.99 0.00,6.20 -2.20,8.21 -4.25,7.36 -4.38,4.38 -5.37,3.10 -8.21,2.20 -8.50,0.00 -5.99,-1.60 -5.37,-3.10 -6.01,-6.01 -4.25,-7.36 -1.60,-5.99"/>
        <circle cx="0" cy="0" r="2.8"/>
      </g>

      <!--  2. スピードメーター (Speedometer = パフォーマンス)  -->
      <g transform="translate(34.5, 132.7) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -8.5 4 A 9.5 9.5 0 1 1 8.5 4"/>
        <line x1="-6" y1="-6" x2="-4" y2="-4" stroke-width="1.3"/>
        <line x1="0" y1="-9.5" x2="0" y2="-6.8" stroke-width="1.3"/>
        <line x1="6" y1="-6" x2="4" y2="-4" stroke-width="1.3"/>
        <circle cx="0" cy="1.5" r="1.2" fill="#ffffff"/>
        <line x1="0" y1="1.5" x2="4.8" y2="-4.5" stroke-width="1.8"/>
      </g>

      <!--  3. フィルムストリップ (Filmstrip = メディア)  -->
      <g transform="translate(34.5, 178.4) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-9" y="-8" width="18" height="16" rx="2"/>
        <line x1="-9" y1="0" x2="9" y2="0"/>
        <line x1="-5" y1="-8" x2="-5" y2="8"/>
        <line x1="-9" y1="-4" x2="-5" y2="-4"/>
        <line x1="-9" y1="4" x2="-5" y2="4"/>
        <line x1="5" y1="-8" x2="5" y2="8"/>
        <line x1="5" y1="-4" x2="9" y2="-4"/>
        <line x1="5" y1="4" x2="9" y2="4"/>
      </g>

      <!--  4. モニター (Display Monitor = 表示)  -->
      <g transform="translate(34.5, 224.1) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8.5" y="-7.5" width="17" height="11.5" rx="2"/>
        <line x1="0" y1="4" x2="0" y2="7"/>
        <line x1="-4" y1="7" x2="4" y2="7"/>
      </g>

      <!--  5. 再生三角 (Play Triangle = 再生)  -->
      <g transform="translate(35.0, 269.8) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="-5.5,-7.5 7.5,0 -5.5,7.5"/>
      </g>

      <!--  6. キーボード (Keyboard = キーボードショートカット)  -->
      <g transform="translate(34.5, 315.5) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-10" y="-7" width="20" height="14" rx="2.2"/>
        <line x1="-7" y1="-3.5" x2="-5" y2="-3.5"/><line x1="-3" y1="-3.5" x2="-1" y2="-3.5"/>
        <line x1="1" y1="-3.5" x2="3" y2="-3.5"/><line x1="5" y1="-3.5" x2="7" y2="-3.5"/>
        <line x1="-6" y1="0.2" x2="-4" y2="0.2"/><line x1="-2" y1="0.2" x2="0" y2="0.2"/>
        <line x1="2" y1="0.2" x2="4" y2="0.2"/><line x1="6" y1="0.2" x2="8" y2="0.2"/>
        <line x1="-4.5" y1="3.8" x2="4.5" y2="3.8"/>
      </g>

      <!--  7. フォルダ (Folder = ファイルパス)  -->
      <g transform="translate(34.5, 361.2) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-9 5 v-10 a1.8 1.8 0 0 1 1.8 -1.8 h4 l2 2 h7.2 a1.8 1.8 0 0 1 1.8 1.8 v8 a1.8 1.8 0 0 1 -1.8 1.8 h-13.4 a1.8 1.8 0 0 1 -1.8 -1.8 z"/>
      </g>

      <!--  8. チェーンリンク (Chain Link = 外部連携)  -->
      <g transform="translate(34.5, 406.9) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-0.8 -1.2 l2.6 -2.6 a3.2 3.2 0 0 1 4.5 4.5 l-2.6 2.6 a3.2 3.2 0 0 1 -4.5 -4.5"/>
        <path d="M0.8 1.2 l-2.6 2.6 a3.2 3.2 0 0 1 -4.5 -4.5 l2.6 -2.6 a3.2 3.2 0 0 1 4.5 4.5"/>
      </g>

      <!--  9. フラスコ (Beaker = 実験的機能)  -->
      <g transform="translate(35.0, 452.6) scale(1.12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-3.5" y1="-8.5" x2="3.5" y2="-8.5"/>
        <path d="M-2 -8.5 v4 l-5.5 10 a1.8 1.8 0 0 0 1.6 2.5 h11.8 a1.8 1.8 0 0 0 1.6 -2.5 l-5.5 -10 v-4"/>
        <line x1="-4.8" y1="3" x2="4.8" y2="3"/>
      </g>

      <!--  8. Sidebar Labels  -->
      <text x="58" y="87.0" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">一般</text>
      <text x="58" y="132.7" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">パフォーマンス</text>
      <text x="58" y="178.4" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">メディア</text>
      <text x="58" y="224.1" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">表示</text>
      <text x="58" y="269.8" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">再生</text>
      <text x="58" y="315.5" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">キーボードショートカット</text>
      <text x="58" y="361.2" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">ファイルパス</text>
      <text x="58" y="406.9" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">外部連携</text>
      <text x="58" y="452.6" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="600" dominant-baseline="central">実験的機能</text>

      <!--  =================================================================  -->
            <!--  =================================================================  -->
      <!--  Right Settings Content Area (一般設定フォーム)                       -->
      <!--  =================================================================  -->

      <!--  Content Title & Description  -->
      <text x="252" y="81" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="18" font-weight="700">一般</text>
      <text x="252" y="106" fill="#9da2af" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500">アプリケーションの基本的な動作を設定します。</text>

      <!--  =================================================================  -->
      <!--  Card 1: 起動と終了 (Startup & Shutdown)                            -->
      <!--  =================================================================  -->
      <rect x="252" y="135" width="748" height="184" rx="8" fill="#25272e" stroke="#2e3038" stroke-width="1"/>
      <!--  Section Title  -->
      <text x="268" y="159" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="700">起動と終了</text>

      <!--  Row 1: 起動時の動作  -->
      <text x="280" y="189" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">起動時の動作</text>
      <!--  Select box  -->
      <rect x="450" y="174" width="320" height="30" rx="5" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <text x="462" y="189" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">前回のプロジェクトを開く</text>
      <path d="M752 186 l3.5 4 l3.5 -4" stroke="#8e929a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!--  Row 2: 終了時の確認  -->
      <text x="280" y="227" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">終了時の確認</text>
      <!--  Checkbox (Checked, Orange)  -->
      <rect x="450" y="219" width="16" height="16" rx="3" fill="#f39c29"/>
      <path d="M453.5 227 l2.5 2.5 l5.5 -5.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="476" y="227" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">プロジェクトを閉じる前に確認ダイアログを表示する</text>

      <!--  Row 3: 自動保存  -->
      <text x="280" y="263" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">自動保存</text>
      <!--  Checkbox (Checked, Orange)  -->
      <rect x="450" y="255" width="16" height="16" rx="3" fill="#f39c29"/>
      <path d="M453.5 263 l2.5 2.5 l5.5 -5.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="476" y="263" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">プロジェクトを自動的に保存する</text>
      <!--  Sub=row: 間隔 5分  -->
      <text x="476" y="297" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">間隔</text>
      <rect x="516" y="282" width="96" height="30" rx="5" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <text x="532" y="297" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">5分</text>
      <path d="M592 294 l3.5 4 l3.5 -4" stroke="#8e929a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!--  =================================================================  -->
      <!--  Card 2: インターフェース (Interface)                               -->
      <!--  =================================================================  -->
      <rect x="252" y="336" width="748" height="182" rx="8" fill="#25272e" stroke="#2e3038" stroke-width="1"/>
      <!--  Section Title  -->
      <text x="268" y="360" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="700">インターフェース</text>

      <!--  Row 1: テーマ  -->
      <text x="280" y="390" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">テーマ</text>
      <rect x="450" y="375" width="230" height="30" rx="5" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <text x="462" y="390" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">ダーク (推奨)</text>
      <path d="M662 387 l3.5 4 l3.5 -4" stroke="#8e929a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!--  Row 2: アクセントカラー  -->
      <text x="280" y="428" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">アクセントカラー</text>
      <rect x="450" y="413" width="150" height="30" rx="5" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <rect x="462" y="421" width="18" height="14" rx="3" fill="#f39c29"/>
      <text x="488" y="428" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">オレンジ</text>
      <path d="M582 425 l3.5 4 l3.5 -4" stroke="#8e929a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!--  Row 3: UIの拡大率  -->
      <text x="280" y="466" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">UIの拡大率</text>
      <rect x="450" y="451" width="150" height="30" rx="5" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <text x="462" y="466" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">100%</text>
      <path d="M582 463 l3.5 4 l3.5 -4" stroke="#8e929a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!--  Row 4: チェックボックス (Unchecked)  -->
      <rect x="450" y="490" width="16" height="16" rx="3" fill="#1c1e24" stroke="#4a4e58" stroke-width="1"/>
      <text x="476" y="498" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">ウィンドウの境界線を細くする</text>

      <!--  =================================================================  -->
      <!--  Card 3: プロジェクト (Project)                                     -->
      <!--  =================================================================  -->
      <rect x="252" y="535" width="748" height="128" rx="8" fill="#25272e" stroke="#2e3038" stroke-width="1"/>
      <!--  Section Title  -->
      <text x="268" y="559" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="13" font-weight="700">プロジェクト</text>

      <!--  Row 1: 新規プロジェクトの場所  -->
      <text x="280" y="591" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">新規プロジェクトの場所</text>
      <!--  Path Input Box with Attached Browse Button  -->
      <!-- Input Left Body (rounded left corners rx=5) -->
      <path d="M455 576 h481 v30 h-481 a5 5 0 0 1 -5 -5 v-20 a5 5 0 0 1 5 -5 z" fill="#1c1e24" stroke="#363942" stroke-width="1"/>
      <text x="462" y="591" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" font-weight="500" dominant-baseline="central">C:\Users\User\Documents\MyApp\Projects</text>
      <!-- Attached Button Right Body (rounded right corners rx=5, w=44) -->
      <path d="M936 576 h39 a5 5 0 0 1 5 5 v20 a5 5 0 0 1 -5 5 h-39 z" fill="#3a3d46" stroke="#4a4e59" stroke-width="1"/>
      <!-- Folder Browse Icon (white outline, centered in button at x=958, y=591) -->
      <g transform="translate(958, 591)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 6 v-10 a1.5 1.5 0 0 1 1.5 -1.5 h3.5 l2 2 h7.5 a1.5 1.5 0 0 1 1.5 1.5 v8 a1.5 1.5 0 0 1 -1.5 1.5 h-13 a1.5 1.5 0 0 1 -1.5 -1.5 z"/>
      </g>

      <!--  Row 2: Checkbox (Checked, Orange)  -->
      <rect x="450" y="621" width="16" height="16" rx="3" fill="#f39c29"/>
      <path d="M453.5 629 l2.5 2.5 l5.5 -5.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="476" y="629" fill="#ffffff" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, Noto Sans JP, sans-serif" font-size="12" dominant-baseline="central">プロジェクトに自動で名前を付ける（例：プロジェクト 1、2…）</text>

    </g>

    <!--  Window outer border outline  -->
    <rect x="0.5" y="0.5" width="1023" height="767" rx="10" ry="10" fill="none" stroke="#2f3136" stroke-width="1" />
  </g>
</svg>