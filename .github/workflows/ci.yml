name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libasound2-dev

      - name: Enforce 800-line source limit
        run: python3 scripts/check_source_line_limit.py

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all features, all targets, warnings = errors)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --all-features

      - name: CLI smoke test
        run: |
          cargo run --features cli --bin kagari -- effects
          cargo run --example gen_test_project
          cargo run --features cli --bin kagari -- validate --project tests/fixtures/test_project.json
          cargo run --features cli --bin kagari -- frame --project tests/fixtures/test_project.json --frame 5 --output /tmp/smoke.png

  windows-compile:
    name: Check Windows Studio build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Windows Studio
        run: cargo check --no-default-features --features ame --bin kagari-studio

  package-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release AmeUI Studio Binary
        run: cargo build --release --features ame --bin kagari-studio

      - name: Create macOS .app Bundle & DMG
        run: ./scripts/package_macos.sh target/release/kagari-studio Kagari-Studio-macOS-${{ matrix.arch }}.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kagari-Studio-macOS-${{ matrix.arch }}-DMG
          path: Kagari-Studio-macOS-${{ matrix.arch }}.dmg
