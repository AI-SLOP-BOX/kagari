name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libasound2-dev

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all features, warnings = errors)
        run: cargo clippy --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --all-features

      - name: CLI smoke test
        run: |
          cargo run --features cli --bin kagari -- effects
          cargo run --example gen_test_project
          cargo run --features cli --bin kagari -- validate --project test_project.json
          cargo run --features cli --bin kagari -- frame --project test_project.json --frame 5 --output /tmp/smoke.png

  package-macos:
    name: Build macOS DMG Bundle
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release GUI Binary
        run: cargo build --release --features gui --bin kagari-studio

      - name: Create macOS .app Bundle & DMG
        run: |
          mkdir -p "target/bundle/Kagari Studio.app/Contents/MacOS"
          mkdir -p "target/bundle/Kagari Studio.app/Contents/Resources"
          cp target/release/kagari-studio "target/bundle/Kagari Studio.app/Contents/MacOS/Kagari Studio"
          chmod +x "target/bundle/Kagari Studio.app/Contents/MacOS/Kagari Studio"

          # Build the native macOS icon from the same logo used in the UI.
          iconset_dir="target/Kagari.iconset"
          mkdir -p "$iconset_dir"
          icon_source="target/kagari_logo.png"
          sips -s format png assets/kagari_logo.webp --out "$icon_source" >/dev/null
          sips -z 16 16 "$icon_source" --out "$iconset_dir/icon_16x16.png" >/dev/null
          sips -z 32 32 "$icon_source" --out "$iconset_dir/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$icon_source" --out "$iconset_dir/icon_32x32.png" >/dev/null
          sips -z 64 64 "$icon_source" --out "$iconset_dir/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$icon_source" --out "$iconset_dir/icon_128x128.png" >/dev/null
          sips -z 256 256 "$icon_source" --out "$iconset_dir/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$icon_source" --out "$iconset_dir/icon_256x256.png" >/dev/null
          sips -z 512 512 "$icon_source" --out "$iconset_dir/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$icon_source" --out "$iconset_dir/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$icon_source" --out "$iconset_dir/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset_dir" -o "target/bundle/Kagari Studio.app/Contents/Resources/Kagari.icns"

          # Generate Info.plist
          cat << 'PLIST' > "target/bundle/Kagari Studio.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Kagari Studio</string>
              <key>CFBundleIdentifier</key>
              <string>org.kagari.studio</string>
              <key>CFBundleName</key>
              <string>Kagari Studio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIconFile</key>
              <string>Kagari</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # Create DMG Image
          hdiutil create -volname "Kagari Studio" -srcfolder "target/bundle/Kagari Studio.app" -ov -format UDZO "Kagari-Studio-macOS.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kagari-Studio-macOS-DMG
          path: Kagari-Studio-macOS.dmg
